{% extends 'base.html' %}
{% block header %}
<link rel="stylesheet" href="{{url_for('static', filename='css/search.css')}}">
<title>Search</title>
{% endblock %}

{% block content %}
<div id="search-container">
    <form action="/results" method="get">
        <div class="row">
            <input class="search-input" type="text" placeholder="Bus, Stop, Destination" name="q">
            <button id="bookmarks-button" type="button" class="form-input fav-button"><img src="{{url_for('static', filename='img/bookmarks.svg')}}"></button>
        </div>
        <div class="row" id="bookmarks-container">
            <p id="no-bookmarks-text">no bookmarks...</p>
        </div>
        <div class="row">
            <input class="submit-input" type="submit" value="Search">
        </div>
    </form>
</div>
<script type="module" src="{{url_for('static', filename='js/search.js')}}"></script>
{% endblock %}
