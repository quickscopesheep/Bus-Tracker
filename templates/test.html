<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .form {
    width: 100%;
    max-width: 600px;     /* optional sanity limit */
    margin: 0 auto;
    padding: 1rem;
    box-sizing: border-box;
  }

  .row {
    display: flex;
    width: 100%;
    gap: 0.5rem;
  }

  .icon-btn {
    aspect-ratio: 1 / 1; /* keeps it square */
    width: 12vw;         /* scales with viewport */
    max-width: 48px;
    min-width: 36px;
    border: none;
    border-radius: 8px;
    font-size: 1.2rem;
    cursor: pointer;
  }

  .text-input {
    flex: 1;
    font-size: 1rem;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .submit-btn {
    margin-top: 0.75rem;
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<form class="form">
  <div class="row">
    <input type="text" class="text-input" placeholder="Type something…" />
    <button type="button" class="icon-btn">♥</button>
  </div>

  <button type="submit" class="submit-btn">Submit</button>
</form>

</body>
</html>
