{% extends 'base.html' %}

{% block header %}
<title>Results</title>
{% endblock %}

{% block content %}

<div class="flex gap-2 min-w-0 flex-wrap">
    <input id="search-text" class="min-w-0 flex-8 p-2 border-2 border-gray-200 rounded-xl" type="text" placeholder="Search Again">
    <input id="search-submit-button" class="min-w-0 flex-2 p-1 border-2 border-gray-200 rounded-xl hover:bg-gray-200 hover:cursor-pointer" type="button" value="Search">
    <input id="page-number-input" class="min-w-0 flex-2 p-2 border-2 border-gray-200 rounded-xl" type="number" placeholder="Pg No" min="1">
</div>
<div id="results-container" class="max-h-[50dvh] p-8 overflow-auto"></div>

<script type="module" src="{{url_for('static', filename='js/results.js')}}"></script>
{% endblock %}
